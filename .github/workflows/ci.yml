name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run setup
      - run: npm run test:studio
      - run: npm run check
      - run: npm run test:kit
